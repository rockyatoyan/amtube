networks:
  amtube:
    driver: bridge

services:
  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - amtube

  db_prod:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_db
    volumes:
      - prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - amtube

volumes:
  redis_data:
  prod_data:
